name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/kfilter-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/kfilter-linux-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/kfilter-macos-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/kfilter-macos-amd64 .

      - name: Generate checksums
        run: cd dist && sha256sum kfilter-* > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
